policies:
  # The following pipelines are designed to work from GitHub action workflows.
  # Updatecli reads its GitHub credentials from the environment. Set either:
  #
  #   UPDATECLI_GITHUB_TOKEN: a personal access token or an installation token
  #
  # or the GitHub App variables:
  #
  #   UPDATECLI_GITHUB_APP_CLIENT_ID
  #   UPDATECLI_GITHUB_APP_PRIVATE_KEY
  #   UPDATECLI_GITHUB_APP_INSTALLATION_ID
  #
  # See https://www.updatecli.io/docs/plugins/scm/github/#_github_app

  # Promote the dev Antora version directory to stable and create the next dev
  # version when a new runtime-enforcer release is detected.
  - name: Promote runtime-enforcer docs on new release
    config:
      - updatecli.d/antora.yaml
    values:
      - values.d/scm.yaml
      - values.d/runtime-enforcer.yaml

  # Update the destination paths in CRD reference docs values files so they
  # point to the latest dev version directory.
  - name: Update CRD reference docs target version
    config:
      - updatecli.d/update-crd-docs-version.yaml
    values:
      - values.d/scm.yaml
      - values.d/runtime-enforcer.yaml

  # Update the destination paths in CLI reference docs values files so they
  # point to the latest dev version directory.
  - name: Update CLI reference docs target version
    config:
      - updatecli.d/update-cli-ref-docs-version.yaml
    values:
      - values.d/scm.yaml
      - values.d/runtime-enforcer.yaml

  # Keep the :release-tag: and :chart-version: attributes of the dev version
  # in sync with the latest upstream release and the latest published chart.
  - name: Update runtime-enforcer release attributes
    config:
      - updatecli.d/update-release-attributes.yaml
    values:
      - values.d/scm.yaml
      - values.d/runtime-enforcer.yaml
