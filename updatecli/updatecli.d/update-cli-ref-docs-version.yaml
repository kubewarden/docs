# {{ $GitHubUser := env ""}}
# {{ $GitHubRepositoryList := env "GITHUB_REPOSITORY" | split "/"}}
# {{ $GitHubPAT := env "GITHUB_TOKEN"}}
# {{ $GitHubUsername := env "GITHUB_ACTOR"}}

# Generic manifest for components that sync a single CLI reference partial.
# The values file must define:
#   component:           the docs component directory name
#   cliReferencePartial: the partial file name under modules/en/partials/
# The values files it edits follow the naming used by update-ref-docs.yaml:
#   values.d/update-<component>-cli-ref-docs.yaml
#   values.d/cli-ref-docs-<component>.yaml

name: 'Update {{ .component }} CLI documentation target version'
pipelineid: "{{ .pipelineid }}"

scms:
  default:
    kind: "github"
    spec:
      user: "{{ default $GitHubUser .scm.user}}"
      email: "{{ .scm.email }}"
      owner: "{{ default $GitHubRepositoryList._0 .scm.owner }}"
      repository: "{{ default $GitHubRepositoryList._1 .scm.repository}}"
      token: "{{ default $GitHubPAT .scm.token }}"
      username: "{{ default $GitHubUsername .scm.username }}"
      branch: "{{ .scm.branch }}"
      commitusingapi: true
      commitmessage:
        hidecredit: true
        footers: "Signed-off-by: Kubewarden bot <cncf-kubewarden-maintainers@lists.cncf.io>"

sources:
  devVersion:
    name: "Find the {{ .component }} dev version"
    kind: shell
    scmid: default
    spec:
      environments:
        - name: "PATH"
      # Read the dev version from the documentation tree rather than
      # computing "latest release + 1". The two only agree while the
      # promotion in updatecli.d/antora.yaml is working: when it is blocked,
      # the arithmetic keeps moving these paths to a directory that does not
      # exist. Reading the tree makes that impossible, and it stays correct
      # whether the promotion ran in this same pipeline or not.
      command: |
        #!/bin/sh
        COMPONENT_DIR="docs/{{ .component }}"

        DEV_VERSION=""
        DEV_COUNT=0

        for dir in ${COMPONENT_DIR}/version-*/; do
          [ -f "${dir}antora.yml" ] || continue
          grep -q "prerelease:" "${dir}antora.yml" || continue

          DEV_COUNT=$((DEV_COUNT + 1))
          [ -n "$DEV_VERSION" ] || DEV_VERSION=$(basename "$dir" | sed 's/^version-//')
        done

        if [ "$DEV_COUNT" -ne 1 ]; then
          echo "${COMPONENT_DIR}: expected exactly 1 dev version directory with 'prerelease:', found ${DEV_COUNT}" >&2
          exit 1
        fi

        echo "$DEV_VERSION"

targets:
  updateCliCopyValuesFile:
    name: "Update {{ .component }} CLI docs copy target version"
    kind: yaml
    sourceid: devVersion
    scmid: default
    spec:
      file: "updatecli/values.d/update-{{ .component }}-cli-ref-docs.yaml"
      key: "$.files[0].dst"
      value: 'docs/{{ .component }}/version-{{ source "devVersion" }}/modules/en/partials/{{ .cliReferencePartial }}'

  updateCliCommitValuesFile:
    name: "Update {{ .component }} CLI docs commit target version"
    kind: yaml
    sourceid: devVersion
    scmid: default
    spec:
      file: "updatecli/values.d/cli-ref-docs-{{ .component }}.yaml"
      key: "$.files[0].dst"
      value: 'docs/{{ .component }}/version-{{ source "devVersion" }}/modules/en/partials/{{ .cliReferencePartial }}'

actions:
  default:
    kind: "github/pullrequest"
    scmid: "default"
    spec:
      automerge: false
# {{ if .pr.title }}
      title: "{{ .pr.title }}"
# {{ end }}
# {{ if .pr.description }}
      description: "{{ .pr.description }}"
# {{ end }}
# {{ if .pr.labels }}
      labels:
# {{ range .pr.labels }}
        - "{{ . }}"
# {{ end }}
# {{ end }}
