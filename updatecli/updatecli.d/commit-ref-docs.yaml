name: "{{ .name }}"

scms:
  target:
    kind: "github"
    spec:
      # Priority set to the environment variable
      user: "{{ .scm.user}}"
      owner: "{{ .scm.owner }}"
      repository: "{{ .scm.repository}}"
      branch: "{{ .scm.branch }}"
      commitusingapi: true
      submodules: false
      commitmessage:
        hidecredit: true
        footers: "Signed-off-by: Kubewarden bot <cncf-kubewarden-maintainers@lists.cncf.io>"

sources:
# {{ range $index, $file := .files }}
  file{{ $index }}:
    kind: file
    spec:
      file: {{ $file.dst }}
# {{ end }}

targets:
# {{ range $index, $file := .files }}
  commit{{ $index }}:
    name: "updates {{ $file.dst }} file"
    kind: file
    scmid: target
    sourceid: file{{ $index }}
    spec:
      file: "{{ $file.dst }}"
      forcecreate: true
# {{ end }}

actions:
  default:
    kind: "github/pullrequest"
    scmid: "target"
    spec:
      merge:
        strategy: manual
# {{ if .pr.title }}
      title: {{ .pr.title }}
# {{ end }}
# {{ if .pr.description }}
      description: {{ .pr.description }}
# {{ end }}
# {{ if .pr.labels }}
      labels:
# {{ range .pr.labels }}
        - "{{ . }}"
# {{ end }}
# {{ end }}
