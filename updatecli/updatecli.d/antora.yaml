# {{ $GitHubUser := env ""}}
# {{ $GitHubRepositoryList := env "GITHUB_REPOSITORY" | split "/"}}
# {{ $GitHubPAT := env "GITHUB_TOKEN"}}
# {{ $GitHubUsername := env "GITHUB_ACTOR"}}

name: 'Bump {{ .component }} version in documentation'
pipelineid: "{{ .pipelineid }}"

scms:
  default:
    kind: "github"
    spec:
      user: "{{ default $GitHubUser .scm.user}}"
      email: "{{ .scm.email }}"
      owner: "{{ default $GitHubRepositoryList._0 .scm.owner }}"
      repository: "{{ default $GitHubRepositoryList._1 .scm.repository}}"
      token: "{{ default $GitHubPAT .scm.token }}"
      username: "{{ default $GitHubUsername .scm.username }}"
      branch: "{{ .scm.branch }}"
      commitusingapi: true
      commitmessage:
        hidecredit: true
        footers: "Signed-off-by: Kubewarden bot <cncf-kubewarden-maintainers@lists.cncf.io>"

sources:
  releaseVersion:
    name: "Get latest {{ .component }} release version"
    kind: githubrelease
    spec:
      # {{ $AppGitHubRepositoryList := .sourceRepository | split "/"}}
      owner: "{{ $AppGitHubRepositoryList._0 }}"
      repository: "{{ $AppGitHubRepositoryList._1 }}"
      token: "{{ default .scm.token $GitHubPAT }}"
      username: "{{ default .scm.username $GitHubUsername }}"
      versionfilter:
        kind: "semver"
        pattern: ">0.1"
    transformers:
      - trimprefix: "v"
      - findsubmatch:
          pattern: '^(\d*).(\d*)'
          captureindex: 0

conditions:
  versionReadyForPromotion:
    name: "Check if {{ .component }} version needs promotion"
    kind: "shell"
    scmid: "default"
    disablesourceinput: true
    spec:
      environments:
        - name: "PATH"
      changedif:
        kind: "exitcode"
        spec:
          failure: 1
          success: 0
          warning: 1
      # This condition answers one question only: is there a release that is
      # still marked as a prerelease in the documentation tree?
      #
      # A false result makes Updatecli skip the promotion target and report
      # the pipeline as skipped, which is the correct outcome when there is
      # simply nothing to promote. Checks that describe a broken repository
      # rather than an up to date one belong in the target, where a failure
      # is reported as a failure.
      command: |+
        #!/bin/sh
        VERSION='{{ source "releaseVersion" }}'
        COMPONENT_DIR="docs/{{ .component }}"
        ANTORA_FILE="${COMPONENT_DIR}/version-${VERSION}/antora.yml"

        if [ -f "$ANTORA_FILE" ]; then
          if ! grep -q "prerelease:" "$ANTORA_FILE"; then
            echo "Version ${VERSION} is already promoted to stable"
            exit 1
          fi
        fi

        exit 0

targets:
  antora:
    kind: "shell"
    name: "Promote {{ .component }} version and create next dev"
    scmid: "default"
    disablesourceinput: true
    spec:
      environments:
        - name: "PATH"
      command: |+
        #!/bin/sh
        set -e

        VERSION='{{ source "releaseVersion" }}'
        COMPONENT='{{ .component }}'
        COMPONENT_DIR="docs/${COMPONENT}"
        TARGET_DIR="${COMPONENT_DIR}/version-${VERSION}"

        MAJOR=$(echo "$VERSION" | cut -d. -f1)
        MINOR=$(echo "$VERSION" | cut -d. -f2)
        NEXT_MINOR=$((MINOR + 1))
        NEXT_VERSION="${MAJOR}.${NEXT_MINOR}"

        # Every component must have exactly one dev version directory, marked
        # with "prerelease:", and exactly one released version directory
        # marked with 'display: "X.Y-latest"'. Anything else is a defect in
        # the documentation tree that a human has to repair, so fail here
        # instead of quietly doing nothing.
        DEV_DIR=""
        DEV_COUNT=0
        CURRENT_LATEST=""
        LATEST_COUNT=0

        for dir in ${COMPONENT_DIR}/version-*/; do
          [ -f "${dir}antora.yml" ] || continue

          if grep -q "prerelease:" "${dir}antora.yml"; then
            DEV_COUNT=$((DEV_COUNT + 1))
            [ -n "$DEV_DIR" ] || DEV_DIR="$dir"
          fi

          if grep -q "display:.*-latest" "${dir}antora.yml"; then
            LATEST_COUNT=$((LATEST_COUNT + 1))
            [ -n "$CURRENT_LATEST" ] || CURRENT_LATEST=$(basename "$dir" | sed 's/^version-//')
          fi
        done

        if [ "$DEV_COUNT" -ne 1 ]; then
          echo "${COMPONENT}: expected exactly 1 dev version directory with 'prerelease:', found ${DEV_COUNT}"
          echo "Add or remove the 'prerelease:' key under ${COMPONENT_DIR} so that exactly one version is a dev version."
          exit 1
        fi

        if [ "$LATEST_COUNT" -ne 1 ]; then
          echo "${COMPONENT}: expected exactly 1 version with a '-latest' display marker, found ${LATEST_COUNT}"
          echo "Add 'display: \"X.Y-latest\"' to the released version under ${COMPONENT_DIR} and remove it from the others."
          exit 1
        fi

        # The component repository defines the version number. The dev
        # directory is only a placeholder for the next release, and its name
        # is a guess: the previous promotion named it "current minor + 1".
        # The rename below makes the documentation adopt the number that
        # upstream published, so the guess never has to be correct. The dev
        # content is preserved and released under that number.
        #
        # Do not replace this rename with a check that the two versions
        # match. A different name here is normal and not an error.
        if [ ! -d "$TARGET_DIR" ]; then
          echo "Renaming $(basename "$DEV_DIR") to version-${VERSION}"
          mv "$DEV_DIR" "$TARGET_DIR"
          sed -i "s/^version:.*$/version: '${VERSION}'/" "${TARGET_DIR}/antora.yml"
        fi

        echo "Promoting: current_latest=${CURRENT_LATEST}, release=${VERSION}, next_dev=${NEXT_VERSION}"
        scripts/make-new-release.sh "${COMPONENT}" "${CURRENT_LATEST}" "${VERSION}" "${NEXT_VERSION}" -n

actions:
  default:
    kind: "github/pullrequest"
    scmid: "default"
    spec:
      automerge: false
# {{ if .pr.title }}
      title: "{{ .pr.title }}"
# {{ end }}
# {{ if .pr.description }}
      description: "{{ .pr.description }}"
# {{ end }}
# {{ if .pr.labels }}
      labels:
# {{ range .pr.labels }}
        - "{{ . }}"
# {{ end }}
# {{ end }}
