policies:
  - name: Copy kwctl CLI reference documentation files
    policy: ghcr.io/updatecli/policies/file:0.2.1
    values:
      - values.d/update-kwctl-cli-ref-docs.yaml
  - name: Copy policy server CLI reference documentation files
    policy: ghcr.io/updatecli/policies/file:0.2.1
    values:
      - values.d/update-policy-server-cli-ref-docs.yaml
  - name: Add header to the CLI reference documentation
    config:
      - updatecli.d/headers.yaml
    values:
      - values.d/headers.yaml
  - name: Copy admission controller CRD reference documentation files
    policy: ghcr.io/updatecli/policies/file:0.2.1
    values:
      - values.d/update-admission-controller-crd-ref-docs.yaml
  - name: Copy SBOMscanner CRD reference documentation files
    policy: ghcr.io/updatecli/policies/file:0.2.1
    values:
      - values.d/update-sbom-scanner-crd-ref-docs.yaml
  - name: Commit admission controller CRD reference documentation
    config:
      - updatecli.d/crd-ref-docs.yaml
    values:
      - values.d/crd-ref-docs-admission-controller.yaml
  - name: Commit SBOMscanner CRD reference documentation
    config:
      - updatecli.d/crd-ref-docs.yaml
    values:
      - values.d/crd-ref-docs-sbom-scanner.yaml
