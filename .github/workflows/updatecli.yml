---
name: Bump documentation version on new release

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * *"

permissions:
  contents: read

jobs:
  admission-controller-docs-update:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Updatecli
        uses: updatecli/updatecli-action@5d180ff09f5204e599bbd6030cd1736009ed5ff2 # v3.9.0

      - name: Promote docs version and update CLI reference paths
        run: "updatecli compose apply --file updatecli/bump-documentation-version.yaml"
        env:
          UPDATECLI_GITHUB_APP_CLIENT_ID: ${{ secrets.APP_ID }}
          UPDATECLI_GITHUB_APP_PRIVATE_KEY: ${{ secrets.APP_PRIV_KEY }}
          UPDATECLI_GITHUB_APP_INSTALLATION_ID: ${{ secrets.APP_INSTALLATION_ID }}

  sbomscanner-docs-update:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Updatecli
        uses: updatecli/updatecli-action@5d180ff09f5204e599bbd6030cd1736009ed5ff2 # v3.9.0

      - name: Promote docs version and update CLI reference paths
        run: "updatecli compose apply --file updatecli/sbomscanner-bump-documentation-version.yaml"
        env:
          UPDATECLI_GITHUB_APP_CLIENT_ID: ${{ secrets.APP_ID }}
          UPDATECLI_GITHUB_APP_PRIVATE_KEY: ${{ secrets.APP_PRIV_KEY }}
          UPDATECLI_GITHUB_APP_INSTALLATION_ID: ${{ secrets.APP_INSTALLATION_ID }}

  runtime-enforcer-docs-update:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Updatecli
        uses: updatecli/updatecli-action@5d180ff09f5204e599bbd6030cd1736009ed5ff2 # v3.9.0

      - name: Promote docs version and update CRD and CLI reference paths
        run: "updatecli compose apply --file updatecli/runtime-enforcer-bump-documentation-version.yaml"
        env:
          UPDATECLI_GITHUB_APP_CLIENT_ID: ${{ secrets.APP_ID }}
          UPDATECLI_GITHUB_APP_PRIVATE_KEY: ${{ secrets.APP_PRIV_KEY }}
          UPDATECLI_GITHUB_APP_INSTALLATION_ID: ${{ secrets.APP_INSTALLATION_ID }}

  network-enforcer-docs-update:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Updatecli
        uses: updatecli/updatecli-action@5d180ff09f5204e599bbd6030cd1736009ed5ff2 # v3.9.0

      - name: Promote docs version and update CRD reference paths
        run: "updatecli compose apply --file updatecli/network-enforcer-bump-documentation-version.yaml"
        env:
          UPDATECLI_GITHUB_APP_CLIENT_ID: ${{ secrets.APP_ID }}
          UPDATECLI_GITHUB_APP_PRIVATE_KEY: ${{ secrets.APP_PRIV_KEY }}
          UPDATECLI_GITHUB_APP_INSTALLATION_ID: ${{ secrets.APP_INSTALLATION_ID }}
