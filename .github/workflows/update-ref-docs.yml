---
name: "Update reference docs"

on:
  workflow_dispatch:
  schedule:
    # Run this job every Monday and Wednesday at 00:00
    - cron: "0 0 * * 1,3"

permissions:
  contents: read

jobs:
  cli-ref-docs:
    name: Update Reference Docs
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout docs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Updatecli Binary
        uses: updatecli/updatecli-action@ca8c01bf875e2520512c344a71dd02f3dc3326a7 # v3.7.0

      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: generate-token
        with:
          app-id: ${{ secrets.APP_ID }} # zizmor: ignore[secrets-outside-env]
          private-key: ${{ secrets.APP_PRIVATE_KEY }} # zizmor: ignore[secrets-outside-env]
          owner: ${{ github.repository_owner }} # the default
          repositories: ${{ github.event.repository.name }}
          # minimum permissions for updatecli to push a branch and open a PR
          permission-contents: write
          permission-pull-requests: write

      - name: Run Updatecli to update reference docs
        run: "updatecli compose apply --file updatecli/update-ref-docs.yaml"
        env:
          GITHUB_TOKEN: ${{ steps.generate-token.outputs.token }}
